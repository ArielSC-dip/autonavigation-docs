<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Graph — autonavigation</title>
<style>
/* ---- tokens (fallback; themes.css los redefine por tema) ---- */
:root{
  --bg:#0f1115; --fg:#e6e9ef; --mut:#8b93a7; --line:#272c37;
  --accent:#6ea8fe; --side:#171a21; --card:#1c2130; --code:#222734;
  --t-architecture:#9aa0a6; --t-rule:#f06292; --t-convention:#ba68c8; --t-entity:#4fc3f7;
  --t-flow:#66bb6a; --t-pattern:#ffb74d; --t-anti_pattern:#ef5350; --t-troubleshooting:#ff8a65;
  --t-decision:#fff176; --t-example:#a1887f; --t-suite:#7e57c2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial,sans-serif}

/* ---- layout ---- */
#app{display:flex;flex-direction:column;height:100vh}
#main{flex:1;display:flex;min-height:0;position:relative}

/* ---- header / toolbar ---- */
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
header .meta{color:var(--mut);font-size:12px}
#toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
#search,#theme,button{background:var(--code);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:12px}
#search{width:220px}
button{cursor:pointer}
button:hover,#theme:hover{border-color:var(--accent)}

/* ---- canvas ---- */
#cv{flex:1;display:block;cursor:grab}
#cv:active{cursor:grabbing}

/* ---- side panel ---- */
#side{width:330px;border-left:1px solid var(--line);background:var(--side);padding:14px;overflow:auto;font-size:13px}
#side h2{font-size:14px;margin:0 0 4px}
#side .id{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--accent);word-break:break-all}
#side .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);margin:6px 6px 0 0}
#side .rel{margin-top:10px}
#side .rel b{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
#side a{color:var(--accent);text-decoration:none;cursor:pointer;display:block;font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:1px 0}
#side a:hover{text-decoration:underline}
.hint{color:var(--mut);font-size:11px;margin-top:6px}

/* ---- leyenda ---- */
#legend{position:absolute;left:14px;bottom:14px;background:var(--side);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;font-size:12px;max-width:240px}
#legend .row{display:flex;align-items:center;gap:7px;margin:3px 0;cursor:pointer;user-select:none}
#legend .row.off{opacity:.35}
#legend .dot{width:11px;height:11px;border-radius:50%}
</style>
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app">
  <!-- ============ HEADER / TOOLBAR ============ -->
  <header>
    <h1>Knowledge Graph — autonavigation</h1>
    <span class="meta" id="meta"></span>
    <div id="toolbar">
      <select id="theme" title="Tema (compartido con el tutorial)"><option value="light">light</option><option value="dark">dark</option><option value="sepia">sepia</option><option value="aurora">aurora</option></select>
      <input id="search" placeholder="buscar id… (Enter)" autocomplete="off">
      <button id="reset">Reset vista</button>
      <button id="reheat">Reordenar</button>
    </div>
  </header>
  <!-- ============ MAIN: canvas + panel + leyenda ============ -->
  <div id="main">
    <canvas id="cv"></canvas>
    <div id="legend"></div>
    <aside id="side"><p class="hint">Clic en un nodo para ver sus relaciones. Rueda = zoom · arrastra fondo = mover · arrastra nodo = fijar.</p></aside>
  </div>
</div>

const TYPES = ["architecture","rule","convention","entity","flow","pattern","anti_pattern","troubleshooting","decision","example","suite"];

/* ---- 2. CONFIG (física en un solo lugar) ---- */
const SIM = {
  link: 110, charge: 1200, gravity: 0.03, spring: 0.03, damping: 0.8,
  minDist: 14, maxV: 12, warmup: 250, cooling: 0.985, minAlpha: 0.05, reheat: 0.4
};

/* ---- 3. STATE ---- */
const nodes = DATA.nodes.map((n,i)=>({...n, x:0, y:0, vx:0, vy:0, fix:false}));
const byId = {}; nodes.forEach(n=>byId[n.id]=n);
const edges = DATA.edges.filter(e=>byId[e.from] && byId[e.to]);
const deg = {}; edges.forEach(e=>{deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1;});
const R0 = Math.sqrt(nodes.length) * 42;
nodes.forEach((n,i)=>{const a=i/nodes.length*Math.PI*2; n.x=Math.cos(a)*R0+(Math.random()-.5)*40; n.y=Math.sin(a)*R0+(Math.random()-.5)*40;});

let TYPE_COLORS = {}, LABEL = '#cfd6e6';   // se rellenan desde el tema (readColors)
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  TYPES.forEach(t=>{ TYPE_COLORS[t] = (cs.getPropertyValue('--t-'+t).trim() || '#999'); });
  LABEL = cs.getPropertyValue('--fg').trim() || '#cfd6e6';
}

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let cam={x:0,y:0,s:1}, sel=null, hidden=new Set(), alpha=1, W=0, H=0;
function resize(){const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;W=r.width;H=r.height;}
window.addEventListener('resize',resize); resize(); cam.x=W/2; cam.y=H/2;

document.getElementById('meta').textContent =
  `${nodes.length} nodos · ${edges.length} aristas · schema v${DATA.schema}`;

/* ---- 4. SIMULATION (un paso) ---- */
function radius(n){ return 4 + Math.min(8,(deg[n.id]||0)*0.7); }
function step(){
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i]; if(hidden.has(a.type)) continue;
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j]; if(hidden.has(b.type)) continue;
      let dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy)||0.01;
      const dd=Math.max(d,SIM.minDist), rep=SIM.charge/(dd*dd);
      const fx=dx/d*rep, fy=dy/d*rep;
      a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    }
    a.vx-=a.x*SIM.gravity; a.vy-=a.y*SIM.gravity;
  }
  edges.forEach(e=>{
    const a=byId[e.from], b=byId[e.to]; if(hidden.has(a.type)||hidden.has(b.type)) return;
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||0.01;
    const f=(d-SIM.link)*SIM.spring, fx=dx/d*f, fy=dy/d*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  });
  nodes.forEach(n=>{
    if(n.fix){ n.vx=n.vy=0; return; }
    n.vx*=SIM.damping; n.vy*=SIM.damping;
    const sp=Math.hypot(n.vx,n.vy);
    if(sp>SIM.maxV){ n.vx=n.vx/sp*SIM.maxV; n.vy=n.vy/sp*SIM.maxV; }
    n.x+=n.vx*alpha; n.y+=n.vy*alpha;
  });
  if(alpha>SIM.minAlpha) alpha*=SIM.cooling;
}

/* ---- 5. RENDER ---- */
function neighbors(id){ const s=new Set([id]); edges.forEach(e=>{ if(e.from===id)s.add(e.to); if(e.to===id)s.add(e.from); }); return s; }
function draw(){
  step();
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(cam.x,cam.y); ctx.scale(cam.s,cam.s);
  const near = sel ? neighbors(sel) : null;
  edges.forEach(e=>{
    const a=byId[e.from], b=byId[e.to]; if(hidden.has(a.type)||hidden.has(b.type)) return;
    const hot = sel && (e.from===sel||e.to===sel);
    ctx.strokeStyle = hot ? 'rgba(110,168,254,.9)' : (sel ? 'rgba(120,130,150,.07)' : 'rgba(120,130,150,.18)');
    ctx.lineWidth=(hot?1.6:0.6)/cam.s;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  nodes.forEach(n=>{
    if(hidden.has(n.type)) return;
    const r=radius(n), dim = near && !near.has(n.id);
    ctx.globalAlpha = dim?0.18:1;
    ctx.fillStyle=TYPE_COLORS[n.type]||'#999';
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2); ctx.fill();
    if(n.id===sel){ ctx.lineWidth=2/cam.s; ctx.strokeStyle=LABEL; ctx.stroke(); }
    if(n.status!=='validated'){ ctx.lineWidth=1.4/cam.s; ctx.strokeStyle='#ffc02e'; ctx.stroke(); }
    if(cam.s>0.7 || n.id===sel || (near&&near.has(n.id))){
      ctx.globalAlpha=dim?0.3:0.92; ctx.fillStyle=LABEL;
      ctx.font=`${11/cam.s}px ui-monospace,Consolas,monospace`;
      ctx.fillText(n.name, n.x+r+2, n.y+3);
    }
  });
  ctx.globalAlpha=1; ctx.restore();
  requestAnimationFrame(draw);
}

/* ---- 6. INTERACTION ---- */
function toWorld(px,py){ return {x:(px-cam.x)/cam.s, y:(py-cam.y)/cam.s}; }
function pick(px,py){ const w=toWorld(px,py); let best=null,bd=1e9;
  nodes.forEach(n=>{ if(hidden.has(n.type))return; const r=radius(n)+4, dx=n.x-w.x, dy=n.y-w.y, d=dx*dx+dy*dy;
    if(d<r*r && d<bd){bd=d;best=n;} }); return best; }
function link(id){ return `<a onclick="select('${id}')">${id}</a>`; }
function select(id){ sel=id; const n=byId[id], f=DATA.forward[id]||{}, r=DATA.reverse[id]||{};
  let h=`<h2>${n.name}</h2><div class="id">${n.id}</div>`;
  h+=`<span class="tag" style="border-color:${TYPE_COLORS[n.type]}">${n.type}</span>`;
  h+=`<span class="tag">${n.status}</span><span class="tag">conf: ${n.confidence}</span>`;
  if(n.version) h+=`<span class="tag">v${n.version}</span>`;
  h+=`<p style="color:var(--mut);margin:10px 0 0">${n.description||''}</p>`;
  const block=(title,obj)=>{ let s=''; Object.keys(obj).forEach(k=>{ if(obj[k]&&obj[k].length) s+=`<div class="rel"><b>${k}</b>${obj[k].map(link).join('')}</div>`; });
    return s?`<div style="margin-top:12px"><b style="color:var(--accent)">${title}</b>${s}</div>`:''; };
  h+=block('relaciones (forward →)', f); h+=block('entrantes (← reverse)', r);
  document.getElementById('side').innerHTML=h;
}
window.select=select;

let drag=null, dn=null, moved=false, last=null;
cv.addEventListener('mousedown',ev=>{ const n=pick(ev.offsetX,ev.offsetY); moved=false;
  if(n){dn=n;n.fix=true;} else drag={x:ev.offsetX,y:ev.offsetY}; last={x:ev.offsetX,y:ev.offsetY}; });
window.addEventListener('mousemove',ev=>{ if(!last)return;
  const dx=ev.offsetX-last.x, dy=ev.offsetY-last.y; if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  if(dn){ const w=toWorld(ev.offsetX,ev.offsetY); dn.x=w.x; dn.y=w.y; dn.vx=dn.vy=0; alpha=Math.max(alpha,SIM.reheat); }
  else if(drag){ cam.x+=dx; cam.y+=dy; } last={x:ev.offsetX,y:ev.offsetY}; });
window.addEventListener('mouseup',()=>{ if(dn&&!moved){ dn.fix=false; select(dn.id); } drag=null; dn=null; last=null; });
cv.addEventListener('wheel',ev=>{ ev.preventDefault(); const f=ev.deltaY<0?1.12:0.89;
  const wx=(ev.offsetX-cam.x)/cam.s, wy=(ev.offsetY-cam.y)/cam.s; cam.s=Math.max(0.15,Math.min(4,cam.s*f));
  cam.x=ev.offsetX-wx*cam.s; cam.y=ev.offsetY-wy*cam.s; },{passive:false});
document.getElementById('reset').onclick=()=>{ cam={x:W/2,y:H/2,s:1}; };
document.getElementById('reheat').onclick=()=>{ alpha=1; };
const search=document.getElementById('search');
search.addEventListener('keydown',ev=>{ if(ev.key!=='Enter')return;
  const q=search.value.trim().toLowerCase(), hit=nodes.find(n=>n.id.toLowerCase().includes(q));
  if(hit){ select(hit.id); cam.x=W/2-hit.x*cam.s; cam.y=H/2-hit.y*cam.s; } });

/* ---- 7. INIT (tema, leyenda, warmup, loop) ---- */
const legend=document.getElementById('legend');
function buildLegend(){
  legend.innerHTML='';
  TYPES.forEach(t=>{ const c=(DATA.by_type[t]||0);
    const row=document.createElement('div'); row.className='row'+(hidden.has(t)?' off':'');
    row.innerHTML=`<span class="dot" style="background:${TYPE_COLORS[t]}"></span><span>${t} (${c})</span>`;
    row.onclick=()=>{ if(hidden.has(t)){hidden.delete(t);row.classList.remove('off');} else {hidden.add(t);row.classList.add('off');} alpha=Math.max(alpha,SIM.reheat); };
    legend.appendChild(row); });
}
(function initTheme(){
  const sel=document.getElementById('theme');
  const saved=localStorage.getItem('autonav-theme')||'light';
  document.documentElement.dataset.theme=saved;
  if(sel){ sel.value=saved;
    sel.addEventListener('change',()=>{ document.documentElement.dataset.theme=sel.value;
      localStorage.setItem('autonav-theme',sel.value); readColors(); buildLegend(); }); }
})();
readColors();
buildLegend();
for(let i=0;i<SIM.warmup;i++) step();
draw();
</script>
</body>
</html>
